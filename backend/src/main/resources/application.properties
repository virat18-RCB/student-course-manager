server.port=8080
server.error.include-message=always

# --- Database: H2 file database (works with no installation) ---
spring.datasource.url=jdbc:h2:file:./data/studentdb
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- To use MySQL instead: comment out the H2 lines above, create a database
# --- named studentdb in MySQL, and uncomment these (use your own password):
#spring.datasource.url=jdbc:mysql://localhost:3306/studentdb
#spring.datasource.username=root
#spring.datasource.password=YOUR_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
